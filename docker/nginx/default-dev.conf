# Pioneer Trips Backend - Dev (127.0.0.1:8020 / devpioneertrips.duckdns.org)
map $http_x_forwarded_proto $php_https { default ""; "https" "on"; }
server {
    listen 80;
    server_name 127.0.0.1 localhost devpioneertrips.duckdns.org _;
    root /var/www/html/public;
    index index.php;
    
    client_max_body_size 100M;
    
    # Forward scheme when behind reverse proxy (e.g. HTTPS at duckdns)
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) { set $forwarded_proto $http_x_forwarded_proto; }
    
    # Handle /storage/app/public/... (if Laravel generates this path)
    location ^~ /storage/app/public/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
    }
    
    # Handle /storage/... (standard Laravel path with symlink)
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
    }
    
    # Serve files referenced with asset('public/...') correctly
    # This handles /public/landing-page/, /public/assets/, etc.
    location ^~ /public/ {
        alias /var/www/html/public/;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
        expires 30d;
    }
    
    # Static files (CSS, JS, Images, Fonts) - Serve directly without PHP processing
    # This MUST come before location / to handle static files correctly
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|otf|mp4|webp|json|xml)$ {
        root /var/www/html/public;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTPS $php_https;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }
    
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

