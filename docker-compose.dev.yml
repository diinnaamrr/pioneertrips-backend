version: "3.8"

services:
  app:
    image: ghcr.io/diinnaamrr/pioneertrips-backend:dev
    container_name: pioneer_app_dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - pioneer-dev-network
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: nginx:alpine
    container_name: pioneer_nginx_dev
    restart: unless-stopped
    ports:
      - "8020:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pioneer-dev-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: pioneer_db_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devpioneertrips_dev
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: devpioneertrips_user
      MYSQL_PASSWORD: root
    volumes:
      - pioneer_dbdata:/var/lib/mysql
    networks:
      - pioneer-dev-network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: pioneer_redis_dev
    restart: unless-stopped
    volumes:
      - pioneer_redisdata:/data
    networks:
      - pioneer-dev-network

networks:
  pioneer-dev-network:
    driver: bridge

volumes:
  pioneer_dbdata:
  pioneer_redisdata:
